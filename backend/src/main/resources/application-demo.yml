spring:
  datasource:
    hikari:
      minimum-idle: 0
      maximum-pool-size: 4
      idle-timeout: 30000
  flyway:
    locations: classpath:db/migration/schema,classpath:db/migration/demo

app:
  demo:
    enabled: true

# The external uptime check must not keep the free database compute awake.
management:
  health:
    db:
      enabled: false
